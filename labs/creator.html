<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creature editor | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- The creature editor (LifeKit design.js + move/legs.js): drag the spine
     into shape, give it pairs of legs anywhere, and it walks — any number
     of legs. A design is data (JSON): copy it, load it. docs/life.md,
     "The creature editor". -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/style/space.css">
<link rel="stylesheet" href="../ui/pages/creator.css">
</head>
<body>
<script src="../ui/data/versions.js"></script>
<script src="../ui/data/catalog.js"></script>
<script src="../ui/shell/log.js"></script>
<script src="../ui/shell/menubar.js"></script>
<div class="bar">
  <span class="sp"></span>
</div>
<div class="foot"><span id="fps" data-auto></span><span class="sp"></span><span>GameLaboratory</span></div>
<script src="../ui/shell/bars.js"></script>
<canvas id="view"></canvas>
<div data-std="info">
  <div class="hudPanel">
    <div id="hudTitle" class="stdName">CREATOR</div>
    <div id="stats"></div>
  </div>
</div>
<div id="hud" data-window="spine" data-title="Body" data-title-pl="Ciało">
  <div class="hudPanel">
    <div class="secHd first">START FROM</div>
    <div id="presets"></div>
    <div class="secHd">MODE</div>
    <div class="twoBtns">
      <button class="tBtn on" id="mEdit" title="Handles on, the creature at rest">EDIT</button>
      <button class="tBtn" id="mPlay" title="Watch it move">PLAY</button>
    </div>
    <div id="playBox" class="hidden">
      <div class="threeBtns" id="gaits">
        <button class="tBtn" data-g="idle">STAND</button>
        <button class="tBtn on" data-g="walk">WALK</button>
        <button class="tBtn" data-g="run">RUN</button>
      </div>
      <label class="sl"><span>Speed</span><b id="spVal">–</b></label>
      <input type="range" id="spSlider" min="0.3" max="5" step="0.1" value="1">
      <label class="sl"><span>Look around</span><b id="lkVal">0%</b></label>
      <input type="range" id="lkSlider" min="0" max="1" step="0.01" value="0">
      <label class="sl"><span>Crouch</span><b id="lwVal">0%</b></label>
      <input type="range" id="lwSlider" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="secHd">SPINE</div>
    <div id="sel">Click a gold point to select it · drag it to shape the body</div>
    <label class="sl"><span>Thickness</span><b id="rVal">–</b></label>
    <input type="range" id="rSlider" min="0.01" max="0.6" step="0.005" value="0.1">
    <label class="sl"><span>Height ÷ width</span><b id="sqVal">–</b></label>
    <input type="range" id="sqSlider" min="0.3" max="2.5" step="0.01" value="1">
    <div class="twoBtns">
      <button class="tBtn" id="ptAdd" title="A new point after the selected one">+ POINT</button>
      <button class="tBtn" id="ptDel" title="Remove the selected point">− POINT</button>
    </div>
  </div>
</div>
<div id="opt" data-window="legs" data-side="right" data-title="Legs, head and skin" data-title-pl="Nogi, głowa i skóra">
  <div class="hudPanel">
    <div class="secHd first">LEGS (PAIRS)</div>
    <div id="pairs"></div>
    <div class="twoBtns">
      <button class="tBtn" id="lgAdd">+ PAIR</button>
      <button class="tBtn" id="lgDel">− PAIR</button>
    </div>
    <div id="legBox">
      <label class="sl"><span>Along the spine</span><b id="ltVal">–</b></label>
      <input type="range" id="ltSlider" min="0.02" max="0.98" step="0.01">
      <label class="sl"><span>Length</span><b id="llVal">–</b></label>
      <input type="range" id="llSlider" min="0.1" max="2.5" step="0.01">
      <label class="sl"><span>Thickness</span><b id="lkThVal">–</b></label>
      <input type="range" id="lkThSlider" min="0.03" max="0.25" step="0.005">
      <label class="sl"><span>Spread (upright → sprawled)</span><b id="lsVal">–</b></label>
      <input type="range" id="lsSlider" min="0" max="2.5" step="0.01">
      <div class="prow"><span>Knee</span><select class="lab" id="lKnee"><option value="1">Forward</option><option value="-1">Back</option></select></div>
      <div class="prow"><span>Foot</span><select class="lab" id="lFoot"><option value="hoof">Hoof</option><option value="paw">Paw</option><option value="claw">Claws</option></select></div>
    </div>
    <div class="secHd">HEAD AND SKIN</div>
    <label class="sl"><span>Eyes back from the tip</span><b id="eaVal">–</b></label>
    <input type="range" id="eaSlider" min="0.02" max="0.5" step="0.01">
    <label class="sl"><span>Eye size</span><b id="esVal">–</b></label>
    <input type="range" id="esSlider" min="0.05" max="0.6" step="0.01">
    <div class="prow"><span>Colour</span><select class="lab" id="sColor"></select></div>
    <div class="prow"><span>Pattern</span><select class="lab" id="sPattern"><option value="0">Plain</option><option value="1">Stripes</option><option value="2">Spots</option><option value="3">Bands</option></select></div>
    <div class="twoBtns"><button class="tBtn" id="sSeed" title="Another pattern">🎲 PATTERN</button><button class="tBtn" id="dName" title="Rename">NAME…</button></div>
    <div class="secHd">DESIGN (JSON)</div>
    <div class="twoBtns">
      <button class="tBtn" id="fCopy">COPY</button>
      <button class="tBtn" id="fLoad">LOAD…</button>
    </div>
    <textarea class="lab hidden" id="fText" placeholder="Paste a design here, then LOAD again"></textarea>
  </div>
</div>
<div class="hudPanel" data-std="camera">
  <div class="twoBtns">
    <button class="tBtn on" id="vSide" title="The camera from the side (best for dragging)">SIDE VIEW</button>
    <button class="tBtn" id="vFree" title="Turn the camera freely">FREE VIEW</button>
  </div>
  <div id="hint">Drag the gold points (spine) and the teal ones (legs, along the spine) · wheel on a point: thickness</div>
</div>
<div class="hudPanel" data-std="perf"></div>
<script src="../ui/shell/perf.js"></script>
<script src="../ui/shell/labwin.js"></script>
<script src="../ui/shell/windows.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/life/lifekit.js"></script>
<script type="module" src="../js/models/life/move/legs.js"></script>
<script type="module" src="../js/models/life/design.js"></script>
<script type="module" src="../js/labs/creator/creator.js"></script>
</body>
</html>

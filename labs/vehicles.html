<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<!-- Ground vehicles (VehicleKit, js/vehiclekit/vehiclekit.js — built from
     ShipKit's generators): each one driving over rough ground — wheels
     spinning and steering, suspension following the bumps, the body
     pitching and rolling, tracks running, dust, lamps at night, and its
     work (tipping the bed, drilling, the crane). docs/vehicles.md. -->
<link rel="stylesheet" href="../css/lab.css">
<link rel="stylesheet" href="../css/windows.css">
<link rel="stylesheet" href="../css/envswitch.css">
<style>
.hidden{ display:none !important; }
#vehTabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
#vehTabs .tBtn{ height:28px; }
.twoBtns{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.threeBtns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
#role{ font-size:13px; color:#9fb1ff; margin:4px 0 6px; line-height:1.35; }
#fpsGraph{ height:40px; }
</style>
</head>
<body>
<script src="../js/labkit/versions.js"></script>
<script src="../js/labkit/menubar.js"></script>
<div class="envSwitch float" data-current="land" data-space="" data-water="marine.html" data-land="vehicles.html"></div>
<script src="../js/labkit/windows.js"></script>
<script src="../js/labkit/envswitch.js"></script>
<canvas id="view"></canvas>
<div id="hud" data-window="left" data-side="left">
  <div id="hudTop">
    <div id="hudTitle"></div>
  </div>
  <div class="hudPanel">
    <div class="secHd first">VEHICLES</div>
    <div id="vehTabs"></div>
    <div id="role"></div>
    <div id="vkPanel">
    <div class="secHd">DRIVE</div>
    <div class="twoBtns">
      <button class="tBtn on" id="dAuto">AUTO</button>
      <button class="tBtn" id="dKeys">WASD</button>
    </div>
    <label class="sl"><span>Speed (auto)</span><b id="sVal">50%</b></label>
    <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0.5">
    <div class="secHd">GROUND</div>
    <label class="sl"><span>Hills</span><b id="hVal">40%</b></label>
    <input type="range" id="hSlider" min="0" max="1" step="0.01" value="0.4">
    <label class="sl"><span>Bumps and rocks</span><b id="bVal">40%</b></label>
    <input type="range" id="bSlider" min="0" max="1" step="0.01" value="0.4">
    <div class="threeBtns">
      <button class="tBtn" id="btnNight">NIGHT</button>
      <button class="tBtn on" id="btnDust">DUST</button>
      <button class="tBtn" id="btnWork">WORK</button>
    </div>
    </div>
    <div id="modePanel"></div>
    <div id="hint">WASD: drive · Left-drag: orbit the camera · Scroll: zoom</div>
  </div>
</div>
<div id="opt" data-window="right" data-side="right">
  <div class="hudPanel">
    <div class="secHd first">VEHICLE</div>
    <div id="vehRows"></div>
    <div class="secHd">NOW</div>
    <div class="row"><span>Speed</span><b id="nowSpeed">–</b></div>
    <div class="row"><span>Pitch / roll</span><b id="nowTilt">–</b></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" src="../js/models/vehicles/vehiclekit.js"></script>
<script type="module" src="../js/labs/vehicles.js"></script>
<script type="module" src="../js/labs/vehicles/train.js"></script>
</body>
</html>

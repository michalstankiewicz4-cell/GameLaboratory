<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle lab · land | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Ground vehicles (VehicleKit, js/models/vehicles/vehiclekit.js — built from
     ShipKit's generators): each one driving over rough ground — wheels
     spinning and steering, suspension following the bumps, the body
     pitching and rolling, tracks running, dust, lamps at night, and its
     work (tipping the bed, drilling, the crane). docs/vehicles.md. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/space.css">
<link rel="stylesheet" href="../ui/pages/vehicles.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<div class="labLoad" data-auto><div class="labLoadCard"><i class="labSpin"></i><b>Building the vehicles…</b><span class="labLoadStep"></span><span class="labLoadBar"><i></i></span></div></div>
<script src="../ui/loader.js"></script>
<div class="bar">
  <select id="vehicle" aria-label="Vehicle"></select>
  <div class="envSwitch" data-current="land" data-space="ship.html" data-water="warship.html" data-land="vehicles.html"></div>
  <span class="sp"></span>
</div>
<div class="foot"><span id="fps" data-auto></span><span class="sp"></span><span>GameLaboratory</span></div>
<script src="../ui/bars.js"></script>
<script src="../ui/windows.js"></script>
<script src="../ui/envswitch.js"></script>
<canvas id="view"></canvas>
<div data-std="info">
  <div class="hudPanel">
    <div id="hudTitle" class="stdName"></div>
    <div id="role" class="stdText"></div>
    <div class="secHd">VEHICLE</div>
    <div id="vehRows"></div>
    <div class="secHd">NOW</div>
    <div class="row"><span>Speed</span><b id="nowSpeed">–</b></div>
    <div class="row"><span>Pitch / roll</span><b id="nowTilt">–</b></div>
  </div>
</div>
<div id="hud" data-window="drive" data-title="Drive and ground" data-title-pl="Jazda i teren">
  <div class="hudPanel">
    <div id="vkPanel">
    <div class="secHd first">DRIVE</div>
    <div class="twoBtns">
      <button class="tBtn on" id="dAuto">AUTO</button>
      <button class="tBtn" id="dKeys">WASD</button>
    </div>
    <label class="sl"><span>Speed (auto)</span><b id="sVal">50%</b></label>
    <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0.5">
    <div class="twoBtns">
      <button class="tBtn on" id="btnDust">DUST</button>
      <button class="tBtn" id="btnWork">WORK</button>
    </div>
    <div class="secHd">GROUND</div>
    <div class="prow"><span>Ground</span><select id="groundSrc" class="lab"><option value="plain">Plain</option><option value="lab">Land lab</option></select></div>
    <label class="sl"><span>Hills</span><b id="hVal">40%</b></label>
    <input type="range" id="hSlider" min="0" max="1" step="0.01" value="0.4">
    <label class="sl"><span>Bumps and rocks</span><b id="bVal">40%</b></label>
    <input type="range" id="bSlider" min="0" max="1" step="0.01" value="0.4">
    </div>
    <div id="modePanel"></div>
  </div>
</div>
<div id="opt" class="hudPanel" data-std="camera">
  <div id="hint">WASD: drive · Left-drag: orbit the camera · Scroll: zoom</div>
</div>
<div class="hudPanel" data-std="light">
  <div class="twoBtns"><button class="tBtn" id="btnNight">NIGHT</button></div>
</div>
<div class="hudPanel" data-std="perf"></div>
<script src="../ui/labwin.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" src="../js/models/vehicles/vehiclekit.js"></script>
<script type="module" src="../js/envs/water/marinekit/marinekit.js"></script>
<script type="module" src="../js/labs/vehicles.js"></script>
<script type="module" src="../js/labs/vehicles/train.js"></script>
<script type="module" src="../js/labs/vehicles/landsource.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Scale lab: every object of the game side by side in one row, at the
     size it has in the game, over a ruler in world units — to decide what
     should grow and what should shrink (docs/scale.md). The sizes are READ
     FROM THE GAME'S OWN FILES (js/config.js, js/world/solarSystem.js,
     js/bodies/comet.js), never copied, so this page can't drift from the
     game: it's an ES module, so like the game it needs a local server
     (python -m http.server 8877, then /scale.html) — unlike ship.html /
     bodies.html it can't be opened straight from disk.
     Models come from the same kits as the game (ShipKit, BodyKit); the
     outline mode draws the sizes that matter for gameplay instead. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/pages/scale.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<div id="bar">
  <h1>SCALE LAB</h1>
  <button type="button" id="btnModels" class="on" title="The game's own models (ShipKit, BodyKit)">Models</button>
  <button type="button" id="btnOutlines" class="on" title="Outlines of the sizes that matter for gameplay">Outlines</button>
  <button type="button" id="btnDetail" title="Model detail: low keeps it light, high is the game's high setting">Detail: low</button>
  <button type="button" id="btnFit" title="Whole row in view">Fit all</button>
  <div id="legend"></div>   <!-- built from scaleLab.js's LEGEND, the same colours as the rings -->
  <span id="fps"></span>
</div>
<div id="labels"></div>
<div id="scaleBar"><span></span><div></div></div>
<div id="hint">Wheel: zoom at the cursor · drag: pan · double-click an object: zoom to it · numbers in world units</div>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" id="shipkit" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" id="bodykit" src="../js/models/bodies/bodykit.js"></script>
<script type="module" src="../js/models/bodies/kinds/planets.js"></script>
<script type="module" src="../js/models/bodies/kinds/giants.js"></script>
<script type="module" src="../js/models/bodies/kinds/pulsars.js"></script>
<script type="module" src="../js/models/bodies/kinds/suns.js"></script>
<script type="module" src="../js/models/bodies/kinds/rocks.js"></script>
<script type="module" src="../js/models/bodies/kinds/holes.js"></script>
<script type="module" src="../js/models/bodies/kinds/sky.js"></script>
<script type="module" src="../js/labs/scale/scaleLab.js"></script>
</body>
</html>

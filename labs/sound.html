<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- The sound lab: MusicKit (js/audio/musickit/musickit.js) — the game's music,
     generated live from layers, parameters and a seed, like ShipKit builds
     ships. Play it, shape it, record it. docs/sound.md. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/space.css">
<link rel="stylesheet" href="../ui/pages/sound.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<canvas id="viz"></canvas>
<div id="tapHint"><b>PRESS PLAY</b>the music is made live, here, from code</div>

<div id="hud" data-window="left" data-side="left">
  <div id="hudTop">
    <div id="hudTitle">SOUND</div>
  </div>
  <div class="hudPanel">
    <div class="secHd first">PLAYER</div>
    <button class="tBtn" id="btnPlay">▶ PLAY</button>
    <div id="nowPlaying"></div>
    <div class="secHd tabHd"><button type="button" id="tabMoods" class="on" title="Ambient: endless, by chance">MOODS</button><button type="button" id="tabMusic" title="Songs: intro, verse, chorus, bridge, outro">MUSIC</button></div>
    <div class="btnGrid" id="presets"></div>
    <div class="songList hidden" id="songs"></div>
    <div class="secHd">SEED</div>
    <div class="seedRow">
      <input class="lab" id="seed" type="number" min="1" step="1" value="1" title="The same seed plays the same piece">
      <button class="tBtn" id="btnDice" title="Another seed">🎲</button>
    </div>
    <div class="secHd">KEY</div>
    <div class="keyRow"><select class="lab" id="root"></select><select class="lab" id="scale"></select></div>
    <div class="secHd">CHARACTER</div>
    <label class="sl"><span>Tempo</span><b id="tempoVal">–</b></label>
    <input type="range" id="tempo" min="36" max="120" step="1" value="60">
    <label class="sl"><span>Density (how much happens)</span><b id="densityVal">–</b></label>
    <input type="range" id="density" min="0" max="1" step="0.01" value="0.5">
    <label class="sl"><span>Brightness</span><b id="brightnessVal">–</b></label>
    <input type="range" id="brightness" min="0" max="1" step="0.01" value="0.45">
    <label class="sl"><span>Space (reverb)</span><b id="spaceVal">–</b></label>
    <input type="range" id="space" min="0" max="1" step="0.01" value="0.7">
    <label class="sl"><span>Volume</span><b id="volumeVal">–</b></label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    <button class="tBtn" id="btnWarm" title="Softer waves, breathing filters, a little imperfection, a chorus, a round bass, a darker reverb — click to compare with the raw sound">WARM SOUND: ON</button>
    <div id="hint">Space: play / stop · every change is heard at once</div>
  </div>
</div>

<div id="opt" data-window="right" data-side="right">
  <div class="hudPanel">
    <div class="secHd first">INSTRUMENTS</div>
    <div id="instruments"></div>
    <div class="secHd">LAYERS</div>
    <div id="layers"></div>
    <div class="secHd">THE ROBOT'S VOICE</div>
    <textarea class="lab" id="lines" title="One line per announcement"></textarea>
    <label class="sl"><span>A line every</span><b id="everyVal">–</b></label>
    <input type="range" id="every" min="10" max="120" step="1" value="45">
    <div class="twoBtns">
      <button class="tBtn" id="btnSay">SAY ONE NOW</button>
      <button class="tBtn" id="btnCopy" title="These settings as data (JSON), for MusicKit">COPY SETTINGS</button>
    </div>
    <div class="secHd">RECORD</div>
    <div class="twoBtns">
      <button class="tBtn" id="btnRec">● RECORD</button>
      <button class="tBtn" id="btnRec60">● 60 SECONDS</button>
    </div>
    <button class="tBtn" id="btnMidi" title="The chosen song's notes as a .mid file: open it in any music program and give it real instruments">♫ EXPORT MIDI (SONGS)</button>
    <div id="recState">A .webm file of the music (the robot's voice isn't in it).</div>
  </div>
</div>

<script src="../ui/windows.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/audio/musickit/musickit.js"></script>
<script type="module" src="../js/labs/sound.js"></script>
</body>
</html>

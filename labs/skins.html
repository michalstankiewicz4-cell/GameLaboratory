<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Skin lab: a standalone prototype of the in-game HUD in two new skins,
     to decide on the look before anything touches the game (the
     prototype-then-integrate workflow). Same layout as the game's HUD
     (1536x1024 design surface, scaled to the window), static sample data,
     a live 2D sketch of the solar system in the viewport. Opens from disk.
       TERMINAL — monochrome green phosphor CRT: scanlines, glow, flicker,
                  box-drawing frames, block-character bars, radar sweep
       SYNTAX   — a colourful code-editor theme: syntax-highlight palette,
                  editor tabs and gutters, function-call buttons, a status
                  bar, glass panels over the viewport
     The logo keeps its shape in both; only its colours change.
     Not wired to the game yet: the game's CSS still has its colours written
     out (~150 of them) — adopting a skin means turning those into
     variables first (docs/skins.md).
     Keys: 1 / 2 switch skins, C toggles the CRT effects (TERMINAL). -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/pages/skins.css">
</head>
<body data-skin="term" data-crt="on">
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<div id="crt"></div>

<div id="stage">
  <!-- logo: same shape, the skin only recolours it -->
  <div id="logo">
    <svg class="logoSvg" viewBox="0 0 52 48" aria-hidden="true">
      <defs>
        <linearGradient id="lgA" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" class="lgA0"/><stop offset="1" class="lgA1"/></linearGradient>
        <linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="lgB0"/><stop offset="1" class="lgB1"/></linearGradient>
        <filter id="phosphor"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="logoG">
        <path d="M16 8 L3 24 L16 40 M36 8 L49 24 L36 40" fill="none" stroke="url(#lgA)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="15" r="3.6" fill="url(#lgB)"/><circle cx="20" cy="30" r="3.6" fill="url(#lgB)"/><circle cx="32" cy="30" r="3.6" fill="url(#lgB)"/>
      </g>
    </svg>
    <div class="title glow">SWARM PROTOCOL</div>
    <div class="ver">v2.19</div>
  </div>

  <div id="stats" class="panel"><div class="statRow">
    <div class="stat"><span>points</span><b class="val" id="sPoints">12,480</b></div>
    <div class="stat"><span>units</span><b class="val">7 + 1</b></div>
    <div class="stat"><span>eaten</span><b class="val">14</b></div>
    <div class="stat"><span>online</span><b class="val">3</b></div>
  </div></div>

  <div id="clock" class="panel"><div class="body">
    <span class="glow">CYCLE <b class="val" id="cyc">6.5</b> <span class="com syn">//</span> <span id="clk">13:42</span></span>
    <span style="display:flex;gap:6px">
      <button class="tBtn" title="Pause">❚❚</button><button class="tBtn on" title="Play">▶</button><button class="tBtn" title="Fast">▶▶</button>
    </span>
  </div></div>

  <!-- navigation -->
  <div id="nav" class="panel">
    <div class="hd"><span class="term">NAV</span><span class="tab on syn" style="--accent:var(--fn)">explorer</span></div>
    <div class="body" id="navList"></div>
  </div>

  <!-- fleet list -->
  <div id="fleet" class="panel">
    <div class="hd"><span class="term">FLEET</span><span class="tab on syn" style="--accent:var(--type)">fleet.swarm</span><span class="tab syn">drone.ds</span></div>
    <div class="body" id="fleetList"></div>
  </div>

  <!-- selected unit -->
  <div id="unit" class="panel focus">
    <div class="hd"><span class="term">UNIT</span><span class="tab on syn" style="--accent:var(--kw)">ship_2.swarm</span></div>
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div class="glow" style="font-size:16px">Ship 2</div><div class="com" style="font-size:12px;opacity:.8">SW-01 SWARMER · program</div></div>
      </div>
      <canvas id="unitThumb" width="420" height="140" style="width:210px;height:70px;margin:8px 0 6px"></canvas>
      <div id="unitBars"></div>
      <div style="height:1px;margin:8px 0" class="sep"></div>
      <div id="unitRows"></div>
      <div class="uBtns" style="margin-top:10px">
        <button title="View"><span class="term">[VIEW]</span><span class="syn fn">view()</span></button>
        <button title="Run the program"><span class="term">[RUN]</span><span class="syn str">run()</span></button>
        <button title="Stop"><span class="term">[STOP]</span><span class="syn kw">stop()</span></button>
        <button title="Edit"><span class="term">[EDIT]</span><span class="syn num">edit()</span></button>
      </div>
    </div>
  </div>

  <!-- the viewport: a live sketch of the solar system -->
  <div id="viewWrap">
    <canvas id="view" width="2080" height="1880"></canvas>
    <div id="camToggle"><button class="on"><span class="term">BASE</span><span class="syn">base</span></button><button><span class="term">SYSTEM</span><span class="syn">system</span></button></div>
    <div id="cmd">
      <div id="cmdTabs"><button class="on"><span class="term">TACTICAL</span><span class="syn">tactics.ts</span></button><button><span class="term">MOVE</span><span class="syn">move.ts</span></button><button><span class="term">BUILD</span><span class="syn">build.ts</span></button><button><span class="term">SPECIAL</span><span class="syn">special.ts</span></button></div>
      <div id="cmdBtns"></div>
    </div>
  </div>

  <!-- planet info -->
  <div id="info" class="panel">
    <div class="hd"><span class="term">OBJECT</span><span class="tab on syn" style="--accent:var(--str)">terra_1.body</span></div>
    <div class="body">
      <canvas id="infoThumb" width="160" height="160" style="width:80px;height:80px;float:left;margin:0 10px 6px 0"></canvas>
      <div class="glow" style="font-size:16px;margin-top:6px">TERRA-1</div>
      <div class="com" style="font-size:12px;opacity:.85">neutral planet · ~27 pts</div>
      <div style="clear:both"></div>
      <div id="infoRows" style="margin-top:4px"></div>
      <div class="uBtns" style="margin-top:12px">
        <button title="Set a waypoint"><span class="term">[WAYPOINT]</span><span class="syn fn">waypoint()</span></button>
        <button title="View"><span class="term">[VIEW]</span><span class="syn str">view()</span></button>
      </div>
    </div>
  </div>

  <!-- event log -->
  <div id="log" class="panel">
    <div class="hd"><span class="term">LOG</span><span class="tab on syn" style="--accent:var(--num)">console</span><span class="tab syn">problems <span class="kw">1</span></span></div>
    <div class="body" id="logList"></div>
  </div>

  <!-- minimap -->
  <div id="mini" class="panel">
    <div class="hd"><span class="term">RADAR</span><span class="tab on syn" style="--accent:var(--fn)">minimap</span></div>
    <div class="body"><canvas id="miniCanvas" width="424" height="508" style="width:212px;height:254px"></canvas></div>
  </div>

  <!-- SYNTAX: an editor status bar under the viewport -->
  <div id="statusBar"></div>
  <div id="skinSwitch">
    <button data-s="term">1 · TERMINAL</button>
    <button data-s="syn">2 · SYNTAX</button>
    <button id="crtBtn" title="CRT effects (key C)">CRT</button>
  </div>
</div>

<script src="../js/labs/skins.js"></script>
</body>
</html>

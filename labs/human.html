<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human lab — humans, faces and their movement | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Human lab: people on LifeKit (js/models/life/lifekit.js) — the humans,
     their faces and their movement (js/models/human/: human.js, face.js,
     walk.js, data/). Split from the life lab, which keeps the other life
     forms. docs/human.md. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/space.css">
<link rel="stylesheet" href="../ui/pages/human.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<canvas id="view"></canvas>
<div id="hud" data-window="left" data-side="left">
  <div id="hudTop">
    <div id="hudTitle"></div>
  </div>
  <div class="hudPanel">
    <div class="secHd first">HUMANS</div>
    <div id="creTabs"></div>
    <div id="blurb"></div>
    <div class="secHd">MOVEMENT · LAND</div>
    <div class="fourBtns" id="gaits">
      <button class="tBtn on" data-g="idle">STAND</button>
      <button class="tBtn" data-g="walk">WALK</button>
      <button class="tBtn" data-g="run">RUN</button>
      <button class="tBtn" data-g="tpose">T-POSE</button>
    </div>
    <label class="sl"><span>Speed</span><b id="spVal">–</b></label>
    <input type="range" id="spSlider" min="0.5" max="6" step="0.1" value="1.4">
    <label class="sl"><span>Time (slow motion)</span><b id="tsVal">100%</b></label>
    <input type="range" id="tsSlider" min="0.05" max="1.5" step="0.05" value="1">
    <div class="twoBtns">
      <button class="tBtn on" id="pInPlace" title="The ground moves under it: the feet against the grid">IN PLACE</button>
      <button class="tBtn" id="pCircle" title="Around a circle; the camera follows">AROUND</button>
    </div>
    <div class="secHd">LAYERS (ON TOP OF ANY GAIT)</div>
    <div id="layerSliders"></div>
    <div class="secHd">VIEW</div>
    <div class="threeBtns">
      <button class="tBtn" id="btnBones">SKELETON</button>
      <button class="tBtn" id="btnWire">WIREFRAME</button>
      <button class="tBtn on" id="btnScale">SCALE BAR</button>
    </div>
    <div id="hint">Drag: turn the camera · Right-drag: pan · Scroll: zoom</div>
  </div>
</div>
<div id="opt" data-window="right" data-side="right">
  <div class="hudPanel">
    <div class="secHd first">BODY</div>
    <div id="params"></div>
    <div class="secHd">FACE</div>
    <div class="threeBtns">
      <button class="tBtn on" id="btnLively" title="Blinks, glances, breathing">LIVELY</button>
      <button class="tBtn" id="btnTalk" title="The jaw and the lips as if speaking">TALK</button>
      <button class="tBtn" id="btnClose" title="The camera to the face">CLOSE-UP</button>
    </div>
    <div class="threeBtns" id="facePresets"></div>
    <div id="faceSliders"></div>
    <div class="secHd">MODEL</div>
    <div id="stats"></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script src="../ui/windows.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/life/lifekit.js"></script>
<script type="module" src="../js/models/human/walk.js"></script>
<script type="module" src="../js/models/human/face.js"></script>
<script type="module" src="../js/models/human/data/bust-head.js"></script>
<script type="module" src="../js/models/human/data/human-head.js"></script>
<script type="module" src="../js/models/human/human.js"></script>
<script type="module" src="../js/labs/shared/studio.js"></script>
<script type="module" src="../js/labs/human.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle lab · space | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Ship lab: procedural spaceships (ShipKit, from the game Space). Scripts, in order (modules):
       1. js/core/three-global.js        – Three.js r186 as the global THREE (graphics of the labs from Battle)
       2. js/render/postkit/postkit.js   – the IMAGE EFFECTS: post-processing (bloom, FXAA, MSAA, filter, depth
                                           of field, sharpening), apart from the model's own controls
       3. js/labkit/labkit.js            – what the Space labs share around the model (sliders, toggles,
                                           performance counters, the IMAGE EFFECTS render, the camera look)
       4. js/models/ships-space/…        – THE SHIP MODELS (window.ShipKit); see shipkit.js's header for the API
       5. js/labs/vehicles-space/vehicles-space.js                – the lab (sky, lights, camera, the windows, sliders, counters)
     Styles: ui/ui.css, ui/style/space.css, ui/pages/vehicles-space.css. Needs a local server (ES modules). -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/style/space.css">
<link rel="stylesheet" href="../ui/pages/vehicles-space.css">
</head>
<body class="viewFits">
<script src="../ui/data/versions.js"></script>
<script src="../ui/data/catalog.js"></script>
<script src="../ui/shell/log.js"></script>
<script src="../ui/shell/menubar.js"></script>
<div class="bar">
  <div class="envSwitch" data-current="space" data-space="vehicles-space.html" data-water="vehicles-water.html" data-land="vehicles-land.html"></div>
  <select id="ship" aria-label="Ship"></select>
  <span class="sp"></span>
</div>
<div class="foot"><span id="fps" data-auto></span><span class="sp"></span><span>GameLaboratory</span></div>
<script src="../ui/shell/bars.js"></script>
<script src="../ui/shell/envswitch.js"></script>
<div id="view"><canvas id="viewCanvas"></canvas></div>

<div id="partTip" class="hidden"></div>
<div id="hud" data-std="info">
  <div id="hudTop">
    <div id="hudTitle" class="stdName" title="Double-click to rename (empty: the original name)"></div>
    <div id="hudSub" class="stdSub" title="Double-click to change the caption (empty: the original)">GAMELABORATORY // SHIP LAB</div>
  </div>
</div>
<div class="hudPanel block" id="blkCtrl" data-window="controls" data-title="Controls" data-title-pl="Sterowanie">
    <div id="hudBtns">
      <button class="tBtn on" id="btnEngines">ENGINES</button>
      <button class="tBtn on" id="btnLights">RUNNING LIGHTS</button>
      <button class="tBtn" id="btnWire">WIREFRAME</button>
      <button class="tBtn tgl off" id="btnFreeze" title="Stop the ship's moving parts (spinners, rings, turrets, particles) and its idle bobbing; lights and engines stay on. OFFLINE switches everything off">STOP ANIMATIONS</button>
      <button class="tBtn" id="btnMerge" title="Build the way the game does: static meshes merged per material (far fewer draw calls), at the game's detail for this model">GAME BUILD</button>
      <button class="tBtn on" id="btnInspect" title="Point at the ship: its part lights up and its name shows (not in GAME BUILD, where the parts are merged)">PART NAMES</button>
    </div>
    <div class="secHd">SHAPING</div>
    <label class="sl"><span>Rounded edges</span><b id="rVal">0%</b></label>
    <input type="range" id="rSlider" min="0" max="1" step="0.01" value="0">
    <label class="sl"><span>Joints</span><b id="sVal">0%</b></label>
    <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0">
    <div class="twoBtns">
      <button class="tBtn on" id="btnFillet" title="The joint's edge rounded: one surface curves into the other">FILLET</button>
      <button class="tBtn" id="btnBead" title="A line of sealant lying on the joint">SEALANT</button>
    </div>
    <div class="secHd">ACTIONS</div>
    <div id="actBtns"></div>
    <label class="sl"><span>Damage</span><b id="dmgVal">0%</b></label>
    <input type="range" id="dmgSlider" min="0" max="1" step="0.01" value="0">
  </div>
<div class="hudPanel block" data-std="camera">
    <div class="twoBtns"><button class="tBtn on" id="btnRotate">AUTO-ROTATE</button></div>
    <div id="fxPanel"></div>
    <div id="hint">Left-drag: rotate · Right-drag: pan · Scroll: zoom</div>
  </div>
<div class="hudPanel block" data-std="light">
    <div class="twoBtns"><button class="tBtn" id="btnGameLight" title="Light the ship the way the game does: its ambient and two scene lights, no shadows">GAME LIGHTING</button></div>
  </div>
<div class="hudPanel block" data-std="perf">
    <div class="secHd">QUALITY</div>
    <label class="sl"><span>Render quality</span><b id="qVal">ULTRA</b></label>
    <input type="range" id="qSlider" min="0" max="4" step="1" value="3">
    <div class="ticks"><span>LOW</span><span>MED</span><span>HIGH</span><span>ULTRA</span><span>MAX</span></div>
    <label class="sl"><span>Geometry detail (triangles)</span><b id="dVal">100%</b></label>
    <input type="range" id="dSlider" min="0.2" max="2" step="0.05" value="1">
    <div class="ticks"><span>20%</span><span>100%</span><span>200%</span></div>
    <div class="secHd">FIGURES</div>
    <ul id="figList"></ul>
  </div>
<div id="loading" class="labLoad"><div class="labLoadCard"><i class="labSpin"></i><b>Generating the hull…</b><span class="labLoadStep"></span><span class="labLoadBar"><i></i></span></div></div>
<script src="../ui/shell/loader.js"></script>

<script src="../ui/shell/perf.js"></script>
<script src="../ui/shell/labwin.js"></script>
<script src="../ui/shell/windows.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<!-- PostKit: the IMAGE EFFECTS panel's post-processing -->
<script type="module" src="../js/render/postkit/postkit.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" id="shipkit" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" id="viewer" src="../js/labs/vehicles-space/vehicles-space.js"></script>
</body>
</html>

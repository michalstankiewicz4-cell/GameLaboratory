<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Filters Lab | GameLaboratory</title>
<meta name="description" content="GameLaboratory filters lab: the camera look from the water labs — exposure, tone mapping, colour, glow, vignette, grain, lens effects and sharpening — on a choice of scenes, compared with the clean image, with the cost of every effect.">
<link rel="canonical" href="https://michalstankiewicz4-cell.github.io/GameLaboratory/labs/filters.html">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/lab-sea.css">
</head>
<!-- Laboratorium filtrów (js/labs/filters/): potok kamery z Battle (js/render/sea/look.js) na wybranej scenie.
     Sceny: js/labs/filters/scenes/, scena bazowa (niebo, światło, morze, grunt): js/labs/filters/stage.js. -->
<body class="lab">
<div id="view"></div>
<div id="split" class="splitline" hidden><span>clean</span><span>look</span></div>
<div class="bar">
  <b>Filters Lab</b> <span class="ver mono" data-lab-version="labs/filters.html"></span>
  <select id="scene" aria-label="Scene"></select>
  <select id="light" aria-label="Light"></select>
  <span class="sp"></span>
  <a href="look.html">Look lab (weather, ageing)</a>
  <a href="../index.html">Labs</a>
</div>
<aside class="panel left">
  <h3>Camera look</h3>
  <div class="btns" id="presets"></div>
  <label class="chk"><input type="checkbox" id="splitOn"> Compare: clean on the left</label>
  <div class="row"><span>Divider</span><input type="range" id="splitX" min="0.1" max="0.9" step="0.01" value="0.5"><output id="splitXV"></output></div>
  <div class="row"><span>Tone mapping</span><select id="tone"><option value="0">ACES</option><option value="1">AgX</option><option value="2">Hable</option></select><output></output></div>
  <label class="chk"><input type="checkbox" id="autoExposure"> Automatic exposure</label>
  <div id="sliders"></div>
  <div class="btns"><button type="button" id="copy">Copy settings (JSON)</button></div>
  <p class="note" id="copied"></p>
</aside>
<aside class="panel right">
  <h3>Camera</h3>
  <div class="row"><span>Field of view</span><input type="range" id="fov" min="20" max="95" value="40"><output id="fovV"></output></div>
  <h3>Performance</h3>
  <div class="row"><span>Render scale</span><input type="range" id="scale" min="0.4" max="1" step="0.05" value="1"><output id="scaleV"></output></div>
  <label class="chk"><input type="checkbox" id="autoRes"> Automatic resolution (keeps ~60 fps)</label>
  <label class="chk"><input type="checkbox" id="aa"> Anti-aliasing (MSAA)</label>
  <label class="chk"><input type="checkbox" id="shadows"> Shadows</label>
  <div class="stats" id="stats"></div>
  <h3>Cost of each effect</h3>
  <div class="btns"><button type="button" id="measure">Measure</button></div>
  <div id="costs"></div>
  <p class="note">Drag to orbit, right-drag to pan, wheel to zoom.</p>
</aside>
<div class="foot">
  <span id="fps"></span>
  <span class="sp"></span>
  <span>GameLaboratory</span>
</div>
<script type="module" src="../js/labs/filters/page.js"></script>
<script src="../js/labkit/versions.js"></script>
</body>
</html>

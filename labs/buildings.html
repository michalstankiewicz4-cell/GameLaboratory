<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Planetary base modules (BaseKit, js/models/base/basekit.js — built from
     ShipKit's generators): each module built, as a placement hologram
     (fits / doesn't fit) and under construction. docs/surface.md. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/space.css">
<link rel="stylesheet" href="../ui/pages/buildings.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<div class="labLoad" data-auto><div class="labLoadCard"><i class="labSpin"></i><b>Building the module…</b><span class="labLoadStep"></span><span class="labLoadBar"><i></i></span></div></div>
<script src="../ui/loader.js"></script>
<div class="bar">
  <span class="sp"></span>
</div>
<div class="foot"><span id="fps" data-auto></span><span class="sp"></span><span>GameLaboratory</span></div>
<script src="../ui/bars.js"></script>
<canvas id="view"></canvas>
<div data-std="info">
  <div class="hudPanel">
    <div id="hudTitle" class="stdName"></div>
    <div class="secHd">MODULE</div>
    <div id="modRows"></div>
    <div class="secHd">MATERIALS (PLANNED)</div>
    <div id="costList"></div>
  </div>
</div>
<div id="hud" data-window="modules" data-title="Modules" data-title-pl="Moduły">
  <div class="hudPanel">
    <div id="modTabs"></div>
    <div class="secHd">VIEW</div>
    <div class="twoBtns">
      <button class="tBtn on" id="vBuilt">BUILT</button>
      <button class="tBtn" id="vOk">GHOST</button>
      <button class="tBtn" id="vBad">BLOCKED</button>
    </div>
    <label class="sl"><span>Construction</span><b id="pVal">100%</b></label>
    <input type="range" id="pSlider" min="0" max="1" step="0.01" value="1">
    <div class="twoBtns"><button class="tBtn" id="btnAnim">BUILD IT</button></div>
  </div>
</div>
<div id="opt" class="hudPanel" data-std="camera">
  <div class="twoBtns"><button class="tBtn on" id="btnRotate">AUTO-ROTATE</button></div>
  <div id="hint">Left-drag: rotate · Right-drag: pan · Scroll: zoom</div>
</div>
<div class="hudPanel" data-std="perf"></div>
<script src="../ui/labwin.js"></script>
<script src="../ui/windows.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" src="../js/models/base/basekit.js"></script>
<script type="module" src="../js/labs/buildings.js"></script>
</body>
</html>

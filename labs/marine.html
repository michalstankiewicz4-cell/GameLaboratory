<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea lab | GameLaboratory</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Sea vehicles (MarineKit, js/envs/water/marinekit/marinekit.js): the sea (waves the
     same in JS and GLSL, foam, shallows), the seabed with an island,
     under water (caustics, the sky's window, marine snow), and four robot
     vessels — riding the waves, rising on foils, diving, driving out onto
     the shore. docs/marine.md. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/space.css">
<link rel="stylesheet" href="../ui/pages/marine.css">
</head>
<body>
<script src="../ui/versions.js"></script>
<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<div class="bar">
  <div class="envSwitch" data-current="water" data-space="" data-water="marine.html" data-land="vehicles.html"></div>
  <span class="sp"></span>
</div>
<div class="foot"><span id="fps" data-auto></span><span class="sp"></span><span>GameLaboratory</span></div>
<script src="../ui/bars.js"></script>
<script src="../ui/envswitch.js"></script>
<canvas id="view"></canvas>
<div id="hud" data-window="left" data-side="left">
  <div id="hudTop">
    <div id="hudTitle"></div>
  </div>
  <div class="hudPanel">
    <div class="secHd first">VESSELS</div>
    <div id="vesTabs"></div>
    <div id="role"></div>
    <div class="secHd">DRIVE</div>
    <div class="twoBtns">
      <button class="tBtn on" id="dAuto">AUTO</button>
      <button class="tBtn" id="dKeys">WASD</button>
    </div>
    <label class="sl"><span>Speed (auto)</span><b id="sVal">60%</b></label>
    <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0.6">
    <label class="sl"><span>Dive (the diver)</span><b id="dVal">0 m</b></label>
    <input type="range" id="dSlider" min="0" max="45" step="0.5" value="0">
    <div class="secHd">SEA</div>
    <label class="sl"><span>Waves</span><b id="wVal">100%</b></label>
    <input type="range" id="wSlider" min="0" max="2.5" step="0.05" value="1">
    <label class="sl"><span>Depth</span><b id="zVal">30 m</b></label>
    <input type="range" id="zSlider" min="12" max="60" step="1" value="30">
    <div class="threeBtns">
      <button class="tBtn" id="btnNight">NIGHT</button>
      <button class="tBtn on" id="btnWake">WAKE</button>
      <button class="tBtn" id="btnWork">WORK</button>
    </div>
    <div id="hint">WASD: steer · Q / E: dive / rise · Left-drag: orbit the camera (take it under water) · Scroll: zoom</div>
  </div>
</div>
<div id="opt" data-window="right" data-side="right">
  <div class="hudPanel">
    <div class="secHd first">VESSEL</div>
    <div id="vesRows"></div>
    <div class="secHd">NOW</div>
    <div class="row"><span>Speed</span><b id="nowSpeed">–</b></div>
    <div class="row"><span>Depth</span><b id="nowDepth">–</b></div>
    <div class="row"><span>Camera</span><b id="nowCam">–</b></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script src="../ui/windows.js"></script>
<script type="module" src="../js/core/three-global.js"></script>
<script type="module" src="../js/labkit/labkit.js"></script>
<script type="module" src="../js/models/ships-space/shipkit.js"></script>
<script type="module" src="../js/models/ships-space/ships/codewing.js"></script>
<script type="module" src="../js/models/ships-space/ships/scribe.js"></script>
<script type="module" src="../js/models/ships-space/ships/swarmer.js"></script>
<script type="module" src="../js/models/ships-space/ships/haven.js"></script>
<script type="module" src="../js/models/vehicles/vehiclekit.js"></script>
<script type="module" src="../js/envs/water/marinekit/marinekit.js"></script>
<script type="module" src="../js/labs/marine.js"></script>
</body>
</html>

<style>
@font-face{ font-family:"Space Grotesk"; font-weight:300 700; src:url(fonts/space-grotesk-var-latin-ext.woff2) format("woff2"); unicode-range:U+0100-024F; }
@font-face{ font-family:"Space Grotesk"; font-weight:300 700; src:url(fonts/space-grotesk-var-latin.woff2) format("woff2"); }
@font-face{ font-family:"IBM Plex Mono"; font-weight:400; src:url(fonts/ibm-plex-mono-400-latin.woff2) format("woff2"); }
:root{ color-scheme:dark; --bg:#0d0f13; --card:#151820; --line:#252a34; --text:#c9ced8; --head:#eef1f6; --dim:#7d8494;
  --game:#36d6b5; --lab:#f2b84b; --tool:#8b9cff; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--text); font:15px/1.5 "Space Grotesk", system-ui, sans-serif; }
body{ background:
  radial-gradient(1200px 500px at 10% -10%, rgba(91,140,255,.14), transparent 60%),
  radial-gradient(900px 500px at 100% 0%, rgba(54,214,181,.10), transparent 60%),
  var(--bg); }
main{ max-width:1240px; margin:0 auto; padding:76px 28px 70px; }
header{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:34px; }
h1{ margin:0; font-size:40px; line-height:1.1; font-weight:700; letter-spacing:-.5px; color:var(--head); }
h1 span{ background:linear-gradient(90deg, #5b8cff, #36d6b5 55%, #f2b84b); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lead{ margin:10px 0 0; max-width:640px; color:#9aa1b0; font-size:16px; }
.stats{ display:flex; gap:10px; flex-wrap:wrap; }
.stat{ padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:rgba(21,24,32,.7); min-width:96px; }
.stat b{ display:block; font-size:22px; color:var(--head); line-height:1.1; }
.stat span{ font-size:12px; color:var(--dim); letter-spacing:.4px; text-transform:uppercase; }
h2{ display:flex; align-items:center; gap:12px; margin:34px 0 14px; font-size:13px; letter-spacing:1.6px; text-transform:uppercase; color:var(--dim); font-weight:600; }
h2::after{ content:""; flex:1; height:1px; background:var(--line); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:16px; }
.tile{ position:relative; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:16px; background:var(--card);
  color:inherit; text-decoration:none; overflow:hidden; transition:transform .18s, border-color .18s, box-shadow .18s; }
.tile:hover{ transform:translateY(-3px); border-color:#3a4256; box-shadow:0 14px 34px rgba(0,0,0,.4), 0 0 0 1px rgba(139,156,255,.15); }
/* reordering: the six-dot grip (top right, on hover), the tile being dragged, its gap */
/* QUICK ACCESS: pinned, last opened, the two most opened; a badge says which */
.quick .tile .badge{ position:absolute; left:10px; top:10px; z-index:2; padding:3px 9px; border-radius:999px; font-size:11px; letter-spacing:.8px;
  text-transform:uppercase; background:rgba(13,15,19,.72); backdrop-filter:blur(4px); color:#eef1f6; border:1px solid rgba(255,255,255,.12); }
.quick .tile .badge.b-pin{ color:#f2b84b; border-color:rgba(242,184,75,.45); }
.quick .tile .badge.b-last{ color:#8b9cff; border-color:rgba(139,156,255,.45); }
.quick .tile .badge.b-most{ color:#36d6b5; border-color:rgba(54,214,181,.45); }
.quick .empty{ display:flex; flex-direction:column; justify-content:center; gap:6px; min-height:150px; padding:18px; border:1.5px dashed var(--line);
  border-radius:16px; color:var(--dim); font-size:14px; }
.quick .empty b{ color:#a7adbb; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
/* the pin, beside the grip (top right, on hover; always on while pinned) */
.pin{ position:absolute; right:46px; top:10px; z-index:2; width:30px; height:30px; display:grid; place-items:center; border-radius:8px;
  background:rgba(13,15,19,.55); backdrop-filter:blur(4px); color:#c9ced8; cursor:pointer; opacity:0; transition:opacity .15s, background .15s; }
.quick .pin{ right:10px; }
.tile:hover .pin, .pin:focus-visible, .pin.on{ opacity:1; }
.pin.on{ color:#f2b84b; }
.pin:hover{ background:rgba(43,58,99,.85); color:#fff; }
.pin svg{ width:15px; height:15px; }
.grip{ position:absolute; right:10px; top:10px; z-index:2; width:30px; height:30px; display:grid; place-items:center; border-radius:8px;
  background:rgba(13,15,19,.55); backdrop-filter:blur(4px); color:#c9ced8; cursor:grab; opacity:0; transition:opacity .15s, background .15s; touch-action:none; }
.tile:hover .grip, .grip:focus-visible{ opacity:1; }
.grip:hover{ background:rgba(43,58,99,.85); color:#fff; }
.grip svg{ width:14px; height:14px; }
.tile.dragging{ position:fixed; z-index:50; pointer-events:none; transform:rotate(1.5deg) scale(1.03); transition:none;
  box-shadow:0 24px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(139,156,255,.35); }
.tile.dragging .grip{ opacity:1; cursor:grabbing; }
.gap{ border:2px dashed #3a4256; border-radius:16px; background:rgba(139,156,255,.05); }
body.reordering, body.reordering *{ cursor:grabbing !important; user-select:none; }
h2 .reset{ order:2; margin-left:4px; font:inherit; font-size:11px; letter-spacing:1px; color:#7d8494; background:none; border:1px solid var(--line);
  border-radius:999px; padding:2px 10px; cursor:pointer; text-transform:uppercase; }
h2 .reset:hover{ color:#eef1f6; border-color:#3a4256; }
h2::after{ order:1; }
.art{ position:relative; aspect-ratio:16/8; overflow:hidden; }
.art svg{ position:absolute; inset:0; width:100%; height:100%; }
.art::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(21,24,32,.85)); }
.body{ padding:12px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.name{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:18px; font-weight:600; color:var(--head); }
.file{ font:12px "IBM Plex Mono", ui-monospace, monospace; color:var(--dim); }
.desc{ font-size:14px; color:#a7adbb; flex:1; }
.art img{ width:100%; height:100%; object-fit:cover; display:block; }
/* the filter: a search box and the phrases of every lab (any tile matching all the chosen ones stays) */
.filter{ display:flex; flex-direction:column; gap:10px; margin:6px 0 4px; }
.filter input{ width:min(420px, 100%); height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:rgba(21,24,32,.8);
  color:var(--head); font:inherit; font-size:14px; outline:none; }
.filter input:focus{ border-color:#3a4256; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font:inherit; font-size:12.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:#a7adbb; cursor:pointer; }
.chip:hover{ color:var(--head); border-color:#3a4256; }
.chip.on{ color:#0d0f13; background:#36d6b5; border-color:#36d6b5; }
.chip.more, .chip.clear{ background:none; color:#7d8494; }
.chip b{ font-weight:500; opacity:.6; margin-left:4px; }
.tile.out{ display:none; }
.noMatch{ color:var(--dim); font-size:14px; padding:8px 2px; }
.phrases{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.phrase{ font-size:11px; padding:1px 7px; border-radius:4px; background:rgba(255,255,255,.05); color:#8f96a5; }
.tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.tag{ font-size:11.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:#a7adbb; }
.tag.game{ color:var(--game); border-color:rgba(54,214,181,.4); background:rgba(54,214,181,.08); }
.tag.lab{ color:var(--lab); border-color:rgba(242,184,75,.4); background:rgba(242,184,75,.08); }
.tag.tool{ color:var(--tool); border-color:rgba(139,156,255,.4); background:rgba(139,156,255,.08); }
footer{ margin-top:46px; color:var(--dim); font-size:13px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
footer a{ color:#9aa1b0; }
@media (max-width:600px){ h1{ font-size:30px; } main{ padding:64px 16px 50px; } }
</style>
</head>

function pinButton(file) {

  p.className = "pin" + (store(PIN_KEY, null) === file ? " on" : ""); p.innerHTML = PIN; p.setAttribute("role", "button"); p.tabIndex = 0;
  p.title = store(PIN_KEY, null) === file ? tr("Unpin", "Odepnij") : tr("Pin to QUICK ACCESS", "Przypnij do SZYBKIEGO DOSTĘPU");
  const toggle = (e) => {
    e.preventDefault(); e.stopPropagation();
    const now = store(PIN_KEY, null) === file ? null : file;
    try { if (now) localStorage.setItem(PIN_KEY, JSON.stringify(now)); else localStorage.removeItem(PIN_KEY); } catch (err) { /* blocked */ }
    render();
  };
  p.addEventListener("click", toggle);
  p.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") toggle(e); });
  return p;
}
function quick() {
  const box = document.getElementById("quick"); box.textContent = "";
  const pinned = store(PIN_KEY, null), recent = store("labsHub.recent", []), visits = store("labsHub.visits", {});
  const known = (f) => ALL.some((x) => x.file === f), used = new Set();
  const slots = [];
  slots.push(["pin", tr("Pinned", "Przypięte"), known(pinned) ? pinned : null, tr("Pin a lab", "Przypnij laboratorium"), tr("The pin on any tile puts it here.", "Pinezka na dowolnym kafelku przypina je tutaj.")]);
  if (slots[0][2]) used.add(slots[0][2]);
  const last = recent.find((f) => known(f) && !used.has(f)) || null;
  slots.push(["last", tr("Last opened", "Ostatnio otwarte"), last, tr("Last opened", "Ostatnio otwarte"), tr("The lab you were in last will wait here.", "Tu poczeka laboratorium, w którym byłeś ostatnio.")]);
  if (last) used.add(last);
  const most = Object.keys(visits).filter((f) => known(f) && !used.has(f)).sort((a, b) => visits[b] - visits[a]);
  [0, 1].forEach((k) => slots.push(["most", tr("Most opened", "Najczęściej otwierane") + (most[k] ? " · " + visits[most[k]] + "×" : ""), most[k] || null, tr("Most opened", "Najczęściej otwierane"), tr("The labs you open most will show up here.", "Tu pojawią się laboratoria, które otwierasz najczęściej.")]));
  slots.forEach(([kind, badge, file, emptyTitle, emptyText]) => {
    if (!file) {
      const e = document.createElement("div"); e.className = "empty";
      e.innerHTML = "<b></b><span></span>"; e.querySelector("b").textContent = emptyTitle; e.querySelector("span").textContent = emptyText;
      box.appendChild(e); return;
    }
    const t = tile(ALL.find((x) => x.file === file));
    const b = document.createElement("span"); b.className = "badge b-" + kind; b.textContent = badge;
    t.appendChild(b);
    if (kind === "pin") t.appendChild(pinButton(file));
    box.appendChild(t);
  });
}

const GRIP = '<svg viewBox="0 0 14 14" aria-hidden="true">' + [3, 7, 11].map((y) => `<circle cx="4.5" cy="${y}" r="1.4" fill="currentColor"/><circle cx="9.5" cy="${y}" r="1.4" fill="currentColor"/>`).join("") + "</svg>";
function fill(gridId, items, key) {
  const grid = document.getElementById(gridId), saved = loadOrder();
  grid.textContent = "";
  ordered(items, saved[key]).forEach((it) => {
    const t = tile(it);
    t.dataset.file = it.file;
    const g = document.createElement("span");
    g.className = "grip"; g.innerHTML = GRIP; g.title = tr("Drag to reorder", "Przeciągnij, by zmienić kolejność"); g.setAttribute("role", "button"); g.tabIndex = 0;
    g.setAttribute("aria-label", tr("Drag to reorder ", "Przeciągnij, by przestawić: ") + it.name + tr(" (or Alt+arrow keys)", " (albo Alt+strzałki)"));
    t.appendChild(g);
    t.appendChild(pinButton(it.file));
    grid.appendChild(t);
  });
  grid.dataset.key = key;
  resetButton(grid);
}
// "Reset order" by the section's heading, while the order is your own
function resetButton(grid) {
  const h = grid.previousElementSibling;
  let b = h.querySelector(".reset");
  const custom = !!loadOrder()[grid.dataset.key];
  if (!custom) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement("button"); b.className = "reset"; b.type = "button"; b.textContent = tr("Reset order", "Przywróć kolejność");
  b.addEventListener("click", () => { const o = loadOrder(); delete o[grid.dataset.key]; saveOrder(o); render(); });
  h.appendChild(b);
}
function remember(grid) {
  const o = loadOrder();
  o[grid.dataset.key] = [...grid.querySelectorAll(".tile")].map((t) => t.dataset.file);
  saveOrder(o);
  resetButton(grid);
}
function render() { quick(); fill("labs", LABS, "labs"); fill("tools", TOOLS, "tools"); applyFilter(); }

// ---------- the filter: phrases (all the chosen ones) and words typed (name, description, phrases) ----------
const chosen = new Set();
let showAll = false;
const fSearch = document.getElementById("fSearch"), fChips = document.getElementById("fChips"), noMatch = document.getElementById("noMatch");
fSearch.placeholder = tr("Search the labs…", "Szukaj laboratoriów…");
const fold = (x) => x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l");
function counts() {
  const c = new Map();
  for (const it of LABS.concat(TOOLS)) for (const w of PHRASES[it.file] || []) c.set(w, (c.get(w) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1] || phrase(a[0]).localeCompare(phrase(b[0])));
}
function chips() {
  fChips.textContent = "";
  const all = counts(), list = showAll ? all : all.filter(([w], i) => i < 16 || chosen.has(w));
  for (const [w, n] of list) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (chosen.has(w) ? " on" : "");
    b.append(phrase(w)); const k = document.createElement("b"); k.textContent = n; b.appendChild(k);
    b.addEventListener("click", () => { if (chosen.has(w)) chosen.delete(w); else chosen.add(w); chips(); applyFilter(); });
    fChips.appendChild(b);
  }
  if (all.length > 16) {
    const m = document.createElement("button"); m.type = "button"; m.className = "chip more";
    m.textContent = showAll ? tr("fewer", "mniej") : tr("all phrases", "wszystkie frazy") + " (" + all.length + ")";
    m.addEventListener("click", () => { showAll = !showAll; chips(); }); fChips.appendChild(m);
  }
  if (chosen.size || fSearch.value) {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip clear"; c.textContent = tr("clear ✕", "wyczyść ✕");
    c.addEventListener("click", () => { chosen.clear(); fSearch.value = ""; chips(); applyFilter(); }); fChips.appendChild(c);
  }
}
function applyFilter() {
  const q = fold(fSearch.value.trim()), words = q ? q.split(/\s+/) : [];
  let shown = 0;
  for (const id of ["labs", "tools"]) document.getElementById(id).querySelectorAll(".tile").forEach((t) => {
    const f = t.dataset.file, ph = PHRASES[f] || [], it = ALL.find((x) => x.file === f);
    const text = fold([it ? it.name : "", it && it.nameEn || "", f, (INFO[f] || [""])[0], INFO_PL[f] || "", ...ph, ...ph.map((w) => PHRASE_EN[w] || "")].join(" "));
    const ok = [...chosen].every((w) => ph.includes(w)) && words.every((w) => text.includes(w));
    t.classList.toggle("out", !ok); if (ok) shown++;
  });
  const active = chosen.size || words.length;
  noMatch.hidden = !active || shown > 0;
  noMatch.textContent = tr("No lab matches — clear the filter.", "Żadne laboratorium nie pasuje — wyczyść filtr.");
  // with a filter on, the tools' heading goes when none of them is left
  const tools = document.getElementById("tools"), anyTool = !!tools.querySelector(".tile:not(.out)");
  tools.style.display = anyTool ? "" : "none"; tools.previousElementSibling.style.display = anyTool ? "" : "none";
}
fSearch.addEventListener("input", () => { chips(); applyFilter(); });
chips();
render();

// FLIP: the other tiles glide to their new places
function glide(grid, change) {
  const tiles = [...grid.querySelectorAll(".tile:not(.dragging)")], before = new Map(tiles.map((t) => [t, t.getBoundingClientRect()]));
  change();
  tiles.forEach((t) => {
    const a = before.get(t), b = t.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    t.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 180, easing: "cubic-bezier(.2,.7,.3,1)" });
  });
}
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const g = e.target.closest(".grip");
  if (!g || e.button !== 0) return;
  e.preventDefault();
  const t = g.closest(".tile"), grid = t.parentElement, r = t.getBoundingClientRect();
  const gap = document.createElement("div"); gap.className = "gap"; gap.style.height = r.height + "px";
  grid.insertBefore(gap, t);
  t.classList.add("dragging");
  Object.assign(t.style, { width: r.width + "px", height: r.height + "px", left: r.left + "px", top: r.top + "px" });
  drag = { t, grid, gap, dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
  document.body.classList.add("reordering");
});
document.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.t.style.left = e.clientX - drag.dx + "px"; drag.t.style.top = e.clientY - drag.dy + "px";
  // the tile under the pointer, in the same section: the gap goes before or after it
  const over = document.elementFromPoint(e.clientX, e.clientY), target = over && over.closest(".tile");
  if (!target || target === drag.t || target.parentElement !== drag.grid) return;
  const r = target.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
  const ref = after ? target.nextSibling : target;
  if (ref === drag.gap || (after ? target.nextSibling === drag.gap : target.previousSibling === drag.gap && !after)) return;
  glide(drag.grid, () => drag.grid.insertBefore(drag.gap, ref));
});
function drop() {
  if (!drag) return;
  const { t, grid, gap } = drag;
  const to = gap.getBoundingClientRect();
  t.style.transition = "left .16s, top .16s"; t.style.left = to.left + "px"; t.style.top = to.top + "px";
  setTimeout(() => {
    grid.insertBefore(t, gap); gap.remove();
    t.classList.remove("dragging"); t.removeAttribute("style");
    remember(grid);
  }, 170);
  drag = null;
  document.body.classList.remove("reordering");
}
document.addEventListener("pointerup", drop);
document.addEventListener("pointercancel", drop);
// the grip and the pin are inside the tile's link: a click on them never opens the lab
document.addEventListener("click", (e) => { if (e.target.closest(".grip")) e.preventDefault(); }, true);
// back from a lab (the browser's back button): the counts have changed
window.addEventListener("pageshow", (e) => { if (e.persisted) quick(); });
// keyboard: on a focused grip, Alt+arrows move the tile
document.addEventListener("keydown", (e) => {
  const g = document.activeElement && document.activeElement.closest && document.activeElement.closest(".grip");
  if (!g || !e.altKey || !/^Arrow(Left|Right|Up|Down)$/.test(e.key)) return;
  e.preventDefault();
  const t = g.closest(".tile"), grid = t.parentElement, back = e.key === "ArrowLeft" || e.key === "ArrowUp";
  const sib = back ? t.previousElementSibling : t.nextElementSibling;
  if (!sib) return;
  glide(grid, () => grid.insertBefore(t, back ? sib : sib.nextSibling));
  remember(grid);
  g.focus();
});
document.getElementById("nLabs").textContent = LABS.length;
document.getElementById("nTools").textContent = TOOLS.length;
document.getElementById("labsVer").textContent = "v" + window.LabMenu.APP_VERSION;
})();
</script>

# Quick checks on every push: JavaScript syntax and the files the pages load (tools/paths.py).
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          fail=0
          while IFS= read -r f; do node --check "$f" || fail=1; done < <(git ls-files '*.js' '*.mjs' ':!vendor/**')
          exit $fail
      - name: Paths
        run: python3 tools/paths.py --strict
      - name: Sitemap
        run: python3 tools/sitemap.py --check

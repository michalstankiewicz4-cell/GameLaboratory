<!-- The safety net for refactoring the kits (ShipKit, BodyKit, BaseKit,
     VehicleKit, MarineKit, SystemKit) and the labs. It builds every
     default model, takes its fingerprint (triangles, meshes, materials,
     textures, size) and compares it with kitcheck.golden.json; then it
     opens every lab in turn and catches its errors. Needs the local server
     (python -m http.server 8877 → /tools/kitcheck.html).
     A change that should keep the models as they are must PASS; one that
     changes them on purpose: check the diff, then UPDATE THE GOLDEN FILE
     (the button copies the new JSON) and commit it with the change.
     ?labs=labs/a.html,labs/b.html checks only those labs. -->
<link rel="stylesheet" href="../ui/ui.css">
<link rel="stylesheet" href="../ui/pages/kitcheck.css">
</head>

<script src="../ui/catalog.js"></script>
<script src="../ui/menubar.js"></script>
<h1>Kit check</h1>
<p>Every default model of every kit against the golden fingerprints, then every lab for errors. Building takes a while; the labs open one by one.</p>
<div><button id="run">RUN AGAIN</button> <button id="copy">COPY NEW GOLDEN JSON</button> <span id="copied" class="dim"></span></div>
<div id="sum">running…</div>
<div id="out"></div>
